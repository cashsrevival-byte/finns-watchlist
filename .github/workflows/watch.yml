name: Watchlist check

on:
  schedule:
    # GitHub's minimum schedule granularity is every 5 minutes, and actual
    # runs can lag behind this during high load on GitHub's side — treat
    # "every 5 minutes" as "at least every 5 minutes, usually."
    - cron: "*/5 * * * *"
  workflow_dispatch: {} # lets you click "Run workflow" manually to test

permissions:
  contents: write # needed to commit the updated seen.json back

concurrency:
  group: watchlist-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install --no-save

      - name: Run watcher
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: node watch.js

      - name: Commit updated seen-state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add seen.json
          git diff --cached --quiet || git commit -m "Update seen listings"
          git push
